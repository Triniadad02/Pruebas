spring.application.name=cancha-cobros
server.port=8080

# --- Conexión a SQL Server -------------------------------------------------
# encrypt + trustServerCertificate: evita errores de certificado en SQL Server local.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=cancha_cobros;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:12345}

# Recarga las plantillas sin reiniciar (solo desarrollo)
spring.thymeleaf.cache=false

# --- PIN del panel del cobrador ---------------------------------------------
# Protege el panel (/), crear partidos y gestionar jugadores. CÁMBIALO.
# Déjalo vacío (app.admin-pin=) para desactivar el PIN en desarrollo.
app.admin-pin=${ADMIN_PIN:1234}
