<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Partido')}"></head>
<body>
<main class="container">
    <a class="back" th:href="@{/}">← Panel</a>

    <!-- Cabecera: datos del partido -->
    <header class="card">
        <h1 th:text="${partido.cancha() != null ? partido.cancha() : 'Partido'}">Partido</h1>
        <p class="muted" th:text="${partido.fecha()}">2026-01-01</p>
        <p>Cancha: <strong th:text="${@fmt.soles(partido.costoTotal())}">S/ 40.00</strong>
            <span th:if="${partido.cuota() != null}"> · Cuota: <strong th:text="${@fmt.soles(partido.cuota())}">S/ 2.50</strong></span>
            <span class="badge" th:text="${partido.estado()}" th:classappend="${partido.estado()}">LISTA</span>
        </p>
        <button type="button" class="btn btn-wa js-compartir" th:data-token="${partido.tokenVer()}">
            Compartir por WhatsApp (solo ver)
        </button>
    </header>

    <p th:if="${error}" class="alert" th:text="${error}"></p>

    <!-- ===================== ESTADO: LISTA (marcar quién vino) ===================== -->
    <section th:if="${partido.estado() == 'LISTA'}">
        <div class="card sticky">
            <span><strong id="contador" th:text="${resumen.presentes()}">0</strong> presentes</span>
            <span>Cuota aprox.: <strong id="cuota-est" th:text="${@fmt.soles(cuotaEstimada)}">—</strong></span>
        </div>

        <ul class="lista">
            <li th:each="f : ${filas}">
                <button type="button" class="fila js-presente" th:classappend="${f.presente()} ? 'on'"
                        th:data-url="@{/api/e/{t}/presente/{j}(t=${partido.tokenEditar()},j=${f.jugadorId()})}">
                    <span class="check"></span>
                    <span th:text="${f.nombre()}">Nombre</span>
                </button>
            </li>
        </ul>

        <form th:action="@{/e/{t}/invitado(t=${partido.tokenEditar()})}" method="post" class="row card">
            <input type="text" name="nombre" maxlength="100" placeholder="Agregar invitado..." required>
            <button class="btn" type="submit">Agregar</button>
        </form>

        <form th:action="@{/e/{t}/iniciar-cobro(t=${partido.tokenEditar()})}" method="post" class="bottom-bar">
            <button class="btn btn-primary btn-big" type="submit">Iniciar cobro</button>
        </form>
    </section>

    <!-- ============== ESTADO: COBRANDO / CERRADO (marcar quién pagó) ============== -->
    <section th:if="${partido.estado() != 'LISTA'}">
        <div class="card resumen">
            <div class="progress"><div id="barra" class="progress-bar" th:style="'width:' + ${resumen.porcentaje()} + '%'"></div></div>
            <div class="grid3">
                <div><span class="muted">Esperado</span><strong id="esperado" th:text="${@fmt.soles(resumen.esperado())}">S/ 0.00</strong></div>
                <div><span class="muted">Cobrado</span><strong id="cobrado" th:text="${@fmt.soles(resumen.cobrado())}">S/ 0.00</strong></div>
                <div><span class="muted">Faltan</span><strong id="pendientes-n" th:text="${resumen.pendientes()}">0</strong></div>
            </div>
            <p class="muted">Balance vs. cancha: <strong id="sobrante" th:text="${@fmt.soles(resumen.sobranteReal())}">S/ 0.00</strong>
                (negativo = falta cubrir; positivo = sobrante para el fondo)</p>
        </div>

        <h2>Pendientes (<span id="n-pendientes" th:text="${#lists.size(pendientes)}">0</span>)</h2>
        <ul class="lista" id="lista-pendientes">
            <li th:each="f : ${pendientes}">
                <button type="button" class="fila pago js-pago" th:disabled="${partido.estado() != 'COBRANDO'}"
                        th:data-url="@{/api/e/{t}/pago/{j}(t=${partido.tokenEditar()},j=${f.jugadorId()})}">
                    <span th:text="${f.nombre()}">Nombre</span>
                    <span class="accion">Cobrar</span>
                </button>
            </li>
        </ul>

        <h2>Pagaron (<span id="n-pagados" th:text="${#lists.size(pagados)}">0</span>)</h2>
        <ul class="lista" id="lista-pagados">
            <li th:each="f : ${pagados}">
                <button type="button" class="fila pago pagado js-pago" th:disabled="${partido.estado() != 'COBRANDO'}"
                        th:data-url="@{/api/e/{t}/pago/{j}(t=${partido.tokenEditar()},j=${f.jugadorId()})}">
                    <span th:text="${f.nombre()}">Nombre</span>
                    <span class="accion">✓ Pagó</span>
                </button>
            </li>
        </ul>

        <div th:if="${partido.estado() == 'COBRANDO'}" class="acciones">
            <!-- Reabrir solo tiene sentido si nadie ha pagado; el JS lo oculta al registrar el primer pago -->
            <form id="form-reabrir" th:action="@{/e/{t}/reabrir(t=${partido.tokenEditar()})}" method="post"
                  th:style="${resumen.pagaron() > 0} ? 'display:none'">
                <button class="btn" type="submit">↩ Reabrir lista (llegó alguien tarde)</button>
            </form>
            <form th:action="@{/e/{t}/cerrar(t=${partido.tokenEditar()})}" method="post" onsubmit="return confirmarCierre()">
                <button class="btn btn-primary btn-big" type="submit">Cerrar partido</button>
            </form>
        </div>
    </section>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
